name: CI & Deploy

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Supersede older runs of the same PR. Runs on main queue instead, so a deploy is never cut short.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs below run side by side; `npm run check` is the same work in one command for local use.
jobs:
    check:
        name: Build, typecheck and test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Build packages
              run: npm run build && npm run build:editor

            # The public API of every entry point matches its committed report.
            - name: Check API reports
              run: npm run api:check

            # Every exported symbol needs TSDoc; internals are tagged @internal.
            - name: Check API docs
              run: npm run docs:check

            # Jest only transpiles TypeScript; type errors in sources and tests fail here.
            - name: Typecheck sources and tests
              run: npm run typecheck

            - name: Run tests
              run: npm run test:coverage

            - name: Smoothness sweep
              run: npm run check:smoothness

            - name: Verify package tarball contents
              run: npm run check:pack

    # The Unity exporter's C# compiled under .NET against stand-ins for the Unity API, its fixtures
    # exported and compared with the golden files the babylon.quarks suite loads.
    exporter:
        name: Unity exporter
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 8.0.x

            - name: Export the fixtures and compare with the golden files
              run: npm run test:exporter
              env:
                  DOTNET_CLI_TELEMETRY_OPTOUT: 1
                  DOTNET_NOLOGO: 1

    # Every demo opened in headless WebGL; any page error, console error or console warning fails
    # the job. Software WebGL is CPU-bound, so the demos are split over two machines rather than
    # opened side by side.
    demos:
        name: Demo smoke (${{ matrix.shard }}/2)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build examples
              run: npm run build:examples

            - name: Read Playwright version
              id: playwright
              run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

            # Headless runs only need the headless shell, and the runner image already has its
            # system libraries: `--with-deps` would spend minutes in apt on fonts and xvfb.
            - name: Install Chromium for the demo smoke
              run: npx playwright install --only-shell chromium

            - name: Smoke-test the demos
              run: |
                  npm run preview -w examples -- --host 127.0.0.1 --port 3010 --strictPort &
                  for i in $(seq 1 60); do curl -sf http://127.0.0.1:3010/ >/dev/null && break; sleep 1; done
                  npm run check:demos -- --shard=${{ matrix.shard }}/2

    # Every shader variant the library can emit (`shaderVariants()`), compiled in GLSL on a WebGL2
    # engine and in WGSL by Chromium's own WGSL compiler, both on its software (SwiftShader) adapter;
    # no GPU needed. A variant that fails to compile fails the job.
    shaders:
        name: Shader compile (GLSL + WGSL)
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build examples
              run: npm run build:examples

            - name: Read Playwright version
              id: playwright
              run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

            # The runner image already has the headless shell's system libraries.
            - name: Install Chromium for the shader compile
              run: npx playwright install --only-shell chromium

            - name: Compile every shader variant
              run: |
                  npm run preview -w examples -- --host 127.0.0.1 --port 3010 --strictPort &
                  for i in $(seq 1 60); do curl -sf http://127.0.0.1:3010/ >/dev/null && break; sleep 1; done
                  npm run validate:shaders

    # Pages build only on main / manual dispatch. The docs are written into examples/dist, so they
    # are built after the examples.
    pages:
        name: Build Pages
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build examples
              run: npm run build:examples

            # TypeDoc resolves quarks.core through its built types.
            - name: Build API docs
              run: npm run build:core && npm run docs

            - name: Configure Pages
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: examples/dist

    deploy:
        needs: [check, demos, shaders, pages]
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        # Never cancel an in-progress Pages deployment — that leaves it in a failed state.
        concurrency:
            group: pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
