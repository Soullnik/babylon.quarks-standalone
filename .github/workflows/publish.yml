name: Publish npm package

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC token exchange).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing requires npm >= 11.5.1; Node 20 bundles npm 10.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run package tests
        run: npm run test

      - name: Verify package tarball contents
        run: npm run check:pack

      - name: Publish babylon.quarks
        run: npm publish --workspace=babylon.quarks --access public
