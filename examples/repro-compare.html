<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Repro — thin cube, every option side by side</title>
        <style>
            html,
            body {
                margin: 0;
                background: #0d0f14;
                color: #e8ecf4;
                font:
                    14px/1.3 system-ui,
                    sans-serif;
            }
            #grid {
                display: grid;
                grid-template-columns: repeat(3, 420px);
                gap: 2px;
            }
            .panel {
                position: relative;
            }
            .panel canvas {
                display: block;
                width: 420px;
                height: 310px;
            }
            .label {
                position: absolute;
                left: 10px;
                top: 8px;
                padding: 3px 9px;
                border-radius: 5px;
                background: rgba(8, 10, 16, 0.72);
                letter-spacing: 0.2px;
            }
            .label b {
                color: #ffb86b;
            }
        </style>
    </head>
    <body>
        <div id="grid"></div>
        <script type="module" src="./src/reproCompare.ts"></script>
    </body>
</html>
