<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Babylon.quarks">
    <defs>
        <radialGradient id="q-core" cx="40%" cy="36%" r="72%">
            <stop offset="0%" stop-color="#dbe6ff"/>
            <stop offset="45%" stop-color="#7f9dff"/>
            <stop offset="100%" stop-color="#7a5cff"/>
        </radialGradient>
        <linearGradient id="q-ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#9ec1ff"/>
            <stop offset="100%" stop-color="#b79bff"/>
        </linearGradient>
        <filter id="q-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.4" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <g filter="url(#q-glow)">
        <ellipse cx="32" cy="32" rx="24" ry="10.5" transform="rotate(-28 32 32)" stroke="url(#q-ring)" stroke-width="2.4" opacity="0.85"/>
        <ellipse cx="32" cy="32" rx="24" ry="10.5" transform="rotate(34 32 32)" stroke="url(#q-ring)" stroke-width="1.6" opacity="0.4"/>
        <circle cx="32" cy="32" r="9.5" fill="url(#q-core)"/>
        <circle cx="51.5" cy="21.5" r="3.1" fill="#bcd0ff"/>
        <circle cx="12.5" cy="42" r="2.3" fill="#b79bff"/>
    </g>
</svg>
