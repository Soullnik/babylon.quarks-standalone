<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>babylon.quarks - Examples</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            font-family: Inter, Segoe UI, Roboto, sans-serif;
            background: radial-gradient(1200px 700px at 20% -10%, #1e2e62 0%, #0b1020 55%, #070b16 100%);
            color: #eef3ff;
        }

        .page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 44px);
            letter-spacing: -0.02em;
        }

        .hero p {
            margin: 14px 0 0;
            max-width: 760px;
            color: #b8c5e6;
            line-height: 1.6;
            font-size: 16px;
        }

        .toolbar {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .search {
            width: min(420px, 100%);
            border: 1px solid #2b3761;
            background: rgba(7, 11, 22, 0.75);
            border-radius: 12px;
            color: #eef3ff;
            font-size: 15px;
            padding: 12px 14px;
            outline: none;
        }

        .search:focus {
            border-color: #78a5ff;
            box-shadow: 0 0 0 3px rgba(120, 165, 255, 0.22);
        }

        .stats {
            color: #9fb0d9;
            font-size: 14px;
        }

        .grid {
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
        }

        .card {
            border: 1px solid #2a365f;
            border-radius: 14px;
            padding: 14px;
            background: linear-gradient(180deg, rgba(20, 31, 62, 0.62), rgba(9, 14, 30, 0.7));
            display: flex;
            flex-direction: column;
            min-height: 180px;
            transition: transform 0.2s ease, border-color 0.2s ease;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #4f6fbe;
        }

        .card h3 {
            margin: 12px 0 0;
            font-size: 17px;
            line-height: 1.3;
        }

        .card p {
            margin: 10px 0 12px;
            color: #b7c6ea;
            font-size: 14px;
            line-height: 1.5;
            flex: 1;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            border: 1px solid #34477f;
            border-radius: 999px;
            font-size: 12px;
            color: #9eb9ff;
            padding: 3px 8px;
        }

        .preview {
            height: 90px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .open-link {
            margin-top: 14px;
            display: inline-flex;
            width: fit-content;
            align-items: center;
            justify-content: center;
            color: #d8e3ff;
            text-decoration: none;
            border: 1px solid #4563ad;
            background: rgba(43, 79, 159, 0.24);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .open-link:hover {
            background: rgba(60, 105, 209, 0.35);
            border-color: #658ce8;
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <h1>babylon.quarks examples</h1>
            <p>Interactive gallery of particle demos for Babylon.js. Explore emitter behaviors, blending, trails, and advanced rendering setups used by <code>babylon.quarks</code>.</p>
        </section>
        <section class="toolbar">
            <input id="search" class="search" type="search" placeholder="Search demos by name or tag..." aria-label="Search demos" />
            <span id="stats" class="stats"></span>
        </section>
        <section id="demos" class="grid"></section>
    </main>
    <script type="module" src="./indexMain.js"></script>
</body>
</html>
