<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>babylon.quarks - Examples</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            font-family: Inter, Segoe UI, Roboto, sans-serif;
            background: radial-gradient(1200px 700px at 20% -10%, #1e2e62 0%, #0b1020 55%, #070b16 100%);
            color: #eef3ff;
        }

        .page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 44px);
            letter-spacing: -0.02em;
        }

        .hero p {
            margin: 14px 0 0;
            max-width: 760px;
            color: #b8c5e6;
            line-height: 1.6;
            font-size: 16px;
        }

        .toolbar {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .search {
            width: min(420px, 100%);
            border: 1px solid #2b3761;
            background: rgba(7, 11, 22, 0.75);
            border-radius: 12px;
            color: #eef3ff;
            font-size: 15px;
            padding: 12px 14px;
            outline: none;
        }

        .search:focus {
            border-color: #78a5ff;
            box-shadow: 0 0 0 3px rgba(120, 165, 255, 0.22);
        }

        .stats {
            color: #9fb0d9;
            font-size: 14px;
        }

        .grid {
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
        }

        .card {
            border: 1px solid #2a365f;
            border-radius: 14px;
            padding: 14px;
            background: linear-gradient(180deg, rgba(20, 31, 62, 0.62), rgba(9, 14, 30, 0.7));
            display: flex;
            flex-direction: column;
            min-height: 180px;
            transition: transform 0.2s ease, border-color 0.2s ease;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #4f6fbe;
        }

        .card h3 {
            margin: 12px 0 0;
            font-size: 17px;
            line-height: 1.3;
        }

        .card p {
            margin: 10px 0 12px;
            color: #b7c6ea;
            font-size: 14px;
            line-height: 1.5;
            flex: 1;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            border: 1px solid #34477f;
            border-radius: 999px;
            font-size: 12px;
            color: #9eb9ff;
            padding: 3px 8px;
        }

        .preview {
            height: 90px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .open-link {
            margin-top: 14px;
            display: inline-flex;
            width: fit-content;
            align-items: center;
            justify-content: center;
            color: #d8e3ff;
            text-decoration: none;
            border: 1px solid #4563ad;
            background: rgba(43, 79, 159, 0.24);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .open-link:hover {
            background: rgba(60, 105, 209, 0.35);
            border-color: #658ce8;
        }

        .toolbar-links {
            margin-left: auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .github-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #d8e3ff;
            text-decoration: none;
            border: 1px solid #4563ad;
            background: rgba(43, 79, 159, 0.24);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .github-btn:hover {
            background: rgba(60, 105, 209, 0.35);
            border-color: #658ce8;
        }

        .github-btn svg {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <h1>babylon.quarks examples</h1>
            <p>Interactive gallery of particle demos for Babylon.js. Explore emitter behaviors, blending, trails, and advanced rendering setups used by <code>babylon.quarks</code>.</p>
        </section>
        <section class="toolbar">
            <input id="search" class="search" type="search" placeholder="Search demos by name or tag..." aria-label="Search demos" />
            <span id="stats" class="stats"></span>
            <div class="toolbar-links">
                <a class="github-btn" href="https://github.com/Soullnik/babylon.quarks-standalone" target="_blank" rel="noopener noreferrer" aria-label="babylon.quarks-standalone on GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    GitHub
                </a>
                <a class="github-btn" href="https://www.npmjs.com/package/babylon.quarks" target="_blank" rel="noopener noreferrer" aria-label="babylon.quarks on npm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M1.763 0C.786 0 0 .786 0 1.763v20.474C0 23.214.786 24 1.763 24h20.474c.977 0 1.763-.786 1.763-1.763V1.763C24 .786 23.214 0 22.237 0H1.763zM5.13 5.323l13.837.019-.009 13.818h-3.464l.01-10.382h-3.46L12.04 19.17h-3.47L5.113 5.311z"/></svg>
                    npm
                </a>
            </div>
        </section>
        <section id="demos" class="grid"></section>
    </main>
    <script type="module" src="./indexMain.js"></script>
</body>
</html>
