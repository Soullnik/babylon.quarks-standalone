<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babylon.quarks</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            font-family: Inter, Segoe UI, Roboto, sans-serif;
            background: radial-gradient(1200px 700px at 20% -10%, #1e2e62 0%, #0b1020 55%, #070b16 100%);
            color: #eef3ff;
            overflow-x: hidden;
        }

        #hero-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        .hero-vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse 130% 90% at 50% 32%, transparent 0%, rgba(7, 11, 22, 0.18) 50%, rgba(4, 6, 14, 0.55) 100%),
                linear-gradient(180deg, rgba(7, 11, 22, 0.12) 0%, transparent 22%, transparent 78%, rgba(4, 6, 14, 0.45) 100%);
        }

        .page {
            position: relative;
            z-index: 2;
            max-width: 1120px;
            margin: 0 auto;
            padding: 40px 20px 60px;
            background: transparent;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 44px);
            letter-spacing: -0.02em;
            text-shadow: 0 2px 28px rgba(4, 6, 14, 0.95), 0 0 3px rgba(4, 6, 14, 0.9);
        }

        .hero p {
            margin: 14px 0 0;
            max-width: 760px;
            color: #dce6ff;
            line-height: 1.6;
            font-size: 16px;
            text-shadow: 0 1px 18px rgba(4, 6, 14, 0.92);
        }

        .toolbar {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .search {
            width: min(420px, 100%);
            border: 1px solid #2b3761;
            background: rgba(7, 11, 22, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            color: #eef3ff;
            font-size: 15px;
            padding: 12px 14px;
            outline: none;
        }

        .search:focus {
            border-color: #78a5ff;
            box-shadow: 0 0 0 3px rgba(120, 165, 255, 0.22);
        }

        .stats {
            color: #c8d6f5;
            font-size: 14px;
            text-shadow: 0 1px 12px rgba(4, 6, 14, 0.9);
        }

        .grid {
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
        }

        .card {
            border: 1px solid #2a365f;
            border-radius: 14px;
            padding: 14px;
            background: linear-gradient(180deg, rgba(12, 18, 38, 0.82), rgba(6, 10, 22, 0.88));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            min-height: 180px;
            transition: transform 0.2s ease, border-color 0.2s ease;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #4f6fbe;
        }

        .card h3 {
            margin: 12px 0 0;
            font-size: 17px;
            line-height: 1.3;
        }

        .card p {
            margin: 10px 0 12px;
            color: #b7c6ea;
            font-size: 14px;
            line-height: 1.5;
            flex: 1;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            border: 1px solid #34477f;
            border-radius: 999px;
            font-size: 12px;
            color: #9eb9ff;
            padding: 3px 8px;
        }

        .preview {
            height: 90px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .open-link {
            margin-top: 14px;
            display: inline-flex;
            width: fit-content;
            align-items: center;
            justify-content: center;
            color: #d8e3ff;
            text-decoration: none;
            border: 1px solid #4563ad;
            background: rgba(28, 48, 98, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .open-link:hover {
            background: rgba(60, 105, 209, 0.35);
            border-color: #658ce8;
        }

        .toolbar-links {
            margin-left: auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .github-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #d8e3ff;
            text-decoration: none;
            border: 1px solid #4563ad;
            background: rgba(28, 48, 98, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .github-btn:hover {
            background: rgba(60, 105, 209, 0.35);
            border-color: #658ce8;
        }

        .github-btn svg {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <canvas id="hero-bg" aria-hidden="true"></canvas>
    <div class="hero-vignette" aria-hidden="true"></div>
    <main class="page">
        <section class="hero">
            <h1>Babylon.quarks</h1>
            <p>Interactive gallery of particle demos for Babylon.js. Explore emitter behaviors, blending, trails, and advanced rendering setups used by <code>babylon.quarks</code>.</p>
        </section>
        <section class="toolbar">
            <input id="search" class="search" type="search" placeholder="Search demos by name or tag..." aria-label="Search demos" />
            <span id="stats" class="stats"></span>
            <div class="toolbar-links">
                <a class="github-btn" href="./editor.html" aria-label="Effect editor">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    Effect Editor
                </a>
                <a class="github-btn" href="https://soullnik.github.io/babylon.quarks-standalone/docs/" aria-label="API documentation">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 4h2v5l-1-.75L9 9V4zm9 16H6V4h1v9l3-2.25L13 13V4h5v16z"/></svg>
                    API Docs
                </a>
                <a class="github-btn" href="./benchmark.html" aria-label="Particle benchmark">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4C6.48 4 2 8.48 2 14c0 2.05.62 3.96 1.68 5.55.17.26.46.45.8.45h15.04c.34 0 .63-.19.8-.45A9.93 9.93 0 0 0 22 14c0-5.52-4.48-10-10-10zm1.41 11.41a2 2 0 0 1-2.82 0c-.79-.78-1.85-4.11-2.28-5.55a.4.4 0 0 1 .5-.5c1.44.43 4.77 1.49 5.55 2.28a2 2 0 0 1-.95 3.77z"/></svg>
                    Benchmark
                </a>
                <a class="github-btn" href="https://github.com/Soullnik/babylon.quarks-standalone" target="_blank" rel="noopener noreferrer" aria-label="babylon.quarks-standalone on GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    GitHub
                </a>
                <a class="github-btn" href="https://www.npmjs.com/package/babylon.quarks" target="_blank" rel="noopener noreferrer" aria-label="babylon.quarks on npm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M1.763 0C.786 0 0 .786 0 1.763v20.474C0 23.214.786 24 1.763 24h20.474c.977 0 1.763-.786 1.763-1.763V1.763C24 .786 23.214 0 22.237 0H1.763zM5.13 5.323l13.837.019-.009 13.818h-3.464l.01-10.382h-3.46L12.04 19.17h-3.47L5.113 5.311z"/></svg>
                    npm
                </a>
            </div>
        </section>
        <section id="demos" class="grid"></section>
    </main>
    <script type="module" src="./src/gallery.ts"></script>
</body>
</html>
